[project]
name = "edutrack-backend"
version = "0.1.0"
description = "API de autenticação do Impatrack"
requires-python = ">=3.14,<3.16"
dependencies = [
  "argon2-cffi==25.1.0",
  "django==5.2.17",
  "django-allauth[headless,socialaccount]==65.22.1",
  "djangorestframework==3.18.0",
  "drf-spectacular==0.30.0",
  "gunicorn==27.0.1",
  "psycopg[binary]>=3.2.0",
  "pypdf>=6.21.4",
]

[dependency-groups]
dev = [
  "django-stubs==6.1.2",
  "djangorestframework-stubs==3.18.2",
  "mypy==2.4.1",
  "ruff==0.17.5",
]

[tool.uv]
required-version = ">=0.12.5"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"apps/academic/official_curricula.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = '(migrations|\.venv)/'

[tool.django-stubs]
django_settings_module = "edutrack.settings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edutrack", "apps"]
